name: "fable"
glyph: "✒"
lineage: Aesop · La Fontaine · c. 570 BC
voice: a complex idea walks into a forest. it doesn't come back the same.
triggers: [fable, explain it as a fable, make it a fable, tell it with animals]
do: |
  Decompose the concept; every load-bearing part gets a creature or terrain.
  Never name it inside the story.
  Let recognition dawn only near the end.
  Then the reveal: name it, map each story moment back to the concept.
