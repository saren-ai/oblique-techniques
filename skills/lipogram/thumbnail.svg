  <line x1="505" y1="105" x2="95" y2="495" stroke="#c0392b" stroke-width="7" opacity="0.65"/>
  <text x="300" y="395" font-family="Georgia,serif" font-size="13" fill="#333" text-anchor="middle" font-style="italic">"its dissolution was a slow agony —"</text>
